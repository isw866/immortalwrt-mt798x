name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Initialize build environment
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext libncurses-dev libssl-dev python3 python3-pip unzip zlib1g-dev file wget
        sudo apt install -y python3.12-distutils || echo "skip if not available"

    - name: Clone ImmortalWrt
      run: |
        git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x openwrt
        cp .config openwrt/.config

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Make defconfig
      run: |
        cd openwrt
        make defconfig

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc)

    - name: Upload firmware
      uses: actions/upload-artifact@v3
      with:
        name: firmware
        path: openwrt/bin/targets/
